# Runtime feature gates the running API must hold after every release (acceptance.sh check_gates).
# Names and non-secret on/off values only. Paid messaging and every unauthorised SMS/WhatsApp
# provider path stay OFF until the owner's own activation, which also edits this file.
MESSAGING_PAID_ENABLED=off
MESSAGING_LEGACY_SMS_ENABLED=off
MESSAGING_LEGACY_SMS_MIGRATION_MODE=off
MESSAGING_TERMII_REPORTS_ENABLED=off

name: Messaging production acceptance read only
on:
  push:
    branches: [ops/messaging-production-acceptance]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Inspect release metadata and aggregate database health
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/school-kit
          cid() {
            docker ps -q --filter label=com.docker.compose.project=school-kit --filter "label=com.docker.compose.service=$1"
          }
          check() {
            local running expected c
            c=$(cid "$1")
            [ -n "$c" ]
            running=$(docker inspect -f '{{.Config.Image}} {{.Image}}' "$c")
            expected=$(docker image inspect -f '{{.Id}}' "$2")
            [ "$running" = "$2 $expected" ]
            echo "PASS $1 $2"
          }
          check api ghcr.io/voclain1/school-kit-api@sha256:54c5fdbf9ca2af468f02676e33853ab67b5ee74a24bb9c907433c5d62a3792f9
          check render-worker ghcr.io/voclain1/school-kit-render@sha256:58295a0c82a1ac5280926f32112eb9a753e4859f0551091b1cc9c004a5682bc6
          check web ghcr.io/voclain1/school-kit-web@sha256:28f9b1cf3eae66fc8b23a7d3299287cf5ae133414e48fdc5999250924d3889c5
          check portal ghcr.io/voclain1/school-kit-portal@sha256:19343eb615d0b69bdf91e12bf5165042cf3f3fcd63f30c6b988f1d0a47b77886
          check ops-pinned ghcr.io/voclain1/school-kit-postgres@sha256:1c0ac5407c14975abad8240218366477a6c2515c6d7fbc6a379a121577d4429d
          docker image inspect ghcr.io/voclain1/school-kit-api@sha256:ff767a5bbf2ca7782cc2d987fa9a0dcdc2e79c3b8eaa98906a908afb17c346d6 ghcr.io/voclain1/school-kit-render@sha256:cb17a3e0d3c9e4fba25792126026c268215e2064daa31ddb2e0ac5fa66cf030f >/dev/null
          echo 'PASS recovery images retained'
          cron=$(docker top "$(cid ops-pinned)" -eo pid,args | awk 'NR > 1 && $2 ~ /(^|\/)cron$/ {n++} END {print n+0}')
          [ "$cron" = 1 ] && [ -z "$(cid ops)" ]
          docker exec "$(cid ops-pinned)" test -s /etc/cron.d/school-kit
          echo 'PASS single pinned backup scheduler with installed cron'
          for svc in postgres redis ops-pinned; do
            echo "$svc $(docker inspect -f '{{.State.StartedAt}}' "$(cid "$svc")")"
          done
          pg=$(cid postgres)
          read -r applied rolled unresolved <<< "$(docker exec "$pg" psql -XqAt -v ON_ERROR_STOP=1 -U postgres -d school_kit -F ' ' -c "BEGIN READ ONLY; SELECT count(*) FILTER (WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL), count(*) FILTER (WHERE rolled_back_at IS NOT NULL), count(*) FILTER (WHERE finished_at IS NULL AND rolled_back_at IS NULL) FROM _prisma_migrations; COMMIT;")"
          echo "Migration records: applied=$applied rolled_back=$rolled unresolved=$unresolved"
          [ "$applied" = 209 ] && [ "$unresolved" = 0 ]
          docker exec -i "$pg" psql -XqAt -v ON_ERROR_STOP=1 -U postgres -d school_kit <<'SQL'
          BEGIN READ ONLY;
          SELECT 'Payments with instalment attribution: ' || count(*) FROM payments WHERE installment_id IS NOT NULL;
          SELECT 'Payment links with instalment attribution: ' || count(*) FROM payment_links WHERE installment_id IS NOT NULL;
          SELECT 'Instalment requests: ' || count(*) FROM installment_requests;
          SELECT 'Duplicate Paystack reference groups: ' || count(*) FROM (SELECT school_id, paystack_reference FROM payments WHERE paystack_reference IS NOT NULL GROUP BY 1,2 HAVING count(*) > 1) d;
          SELECT 'Excessive allocations: ' || count(*) FROM payments WHERE allocated_kobo > amount;
          SELECT 'Unprocessed webhook inbox rows: ' || count(*) FROM paystack_webhook_inbox WHERE processed_at IS NULL;
          COMMIT;
          SQL
          docker exec "$(cid api)" node -e '
            const keys = ["MESSAGING_PAID_ENABLED","MESSAGING_TOP_UPS_ENABLED","MESSAGING_TOP_UP_RECOVERY_ENABLED","MESSAGING_META_SIGNUP_ENABLED","MESSAGING_META_WEBHOOK_ENABLED","MESSAGING_META_PHONE_REGISTRATION_ENABLED","MESSAGING_META_TEMPLATE_SUBMISSION_ENABLED","MESSAGING_META_INBOUND_HISTORY_ENABLED","MESSAGING_TERMII_REPORTS_ENABLED","MESSAGING_LEGACY_SMS_ENABLED","MESSAGING_LEGACY_SMS_MIGRATION_MODE"];
            const active = keys.filter(key => !["", "off", "false", "0"].includes((process.env[key] || "").toLowerCase()));
            if (active.length) { console.error("Unexpected messaging gates: " + active.join(", ")); process.exit(1); }
            console.log("PASS production messaging flags disabled");
          '
          REMOTE

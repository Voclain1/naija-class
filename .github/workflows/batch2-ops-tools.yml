# Puts the operator tools on the VPS, so nothing has to be downloaded from a tablet.
# Writes ONLY /opt/school-kit/ops-tools (scripts + a checksum list + the exact head SHA). It
# touches no compose file, no env file, no container, and restarts nothing. The checksum list
# is printed here so the owner can compare it with `sha256sum -c` on the server.
name: batch2-ops-tools
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  ship:
    if: github.event.pull_request.number == 563 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unified-messaging-infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Ship the operator tools (read-only for production state)
        run: |
          set -euo pipefail
          cd infra/vps/ops-tools
          echo "${{ github.event.pull_request.head.sha }}" > HEAD_SHA
          sha256sum *.sh *.py HEAD_SHA | tee SHA256SUMS
          tar -cf - *.sh *.py HEAD_SHA SHA256SUMS | ssh vps 'set -euo pipefail; umask 022; cd /opt/school-kit; rm -rf ops-tools.new; mkdir ops-tools.new; tar -C ops-tools.new -xf -; chmod 755 ops-tools.new/*.sh ops-tools.new/*.py; (cd ops-tools.new && sha256sum -c SHA256SUMS >/dev/null); rm -rf ops-tools.old; if [ -d ops-tools ]; then mv ops-tools ops-tools.old; fi; mv ops-tools.new ops-tools; rm -rf ops-tools.old; echo "tools installed at /opt/school-kit/ops-tools for head $(cat ops-tools/HEAD_SHA)"'

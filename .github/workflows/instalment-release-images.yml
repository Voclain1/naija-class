name: Instalment release images

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

concurrency:
  group: instalment-release-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.app }} without deployment
    if: >-
      github.event.pull_request.number == 566 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/instalment-payment-management'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: infra/vps/Dockerfile.next
          - app: portal
            dockerfile: infra/vps/Dockerfile.next
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
      IMAGE: ghcr.io/voclain1/school-kit-${{ matrix.app }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Extract public build settings
        if: matrix.app != 'api'
        id: public
        env:
          WEB_ENV_FILE: ${{ secrets.WEB_ENV_FILE }}
          PORTAL_ENV_FILE: ${{ secrets.PORTAL_ENV_FILE }}
          APP: ${{ matrix.app }}
        shell: bash
        run: |
          umask 077
          var="${APP^^}_ENV_FILE"
          public="$RUNNER_TEMP/public.env"
          printf '%s\n' "${!var}" | grep -E '^(NEXT_PUBLIC_[A-Z_]+|SESSION_COOKIE_DOMAIN)=' > "$public"
          echo "sha=$(sha256sum "$public" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "path=$public" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: release
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE }}:instalment-candidate-${{ env.RELEASE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          build-args: |
            APP=${{ matrix.app }}
            PUBLIC_ENV_SHA=${{ steps.public.outputs.sha }}
            SENTRY_RELEASE=${{ env.RELEASE_SHA }}
          secret-files: ${{ steps.public.outputs.path && format('public_env={0}', steps.public.outputs.path) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Record immutable candidate
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s %s@%s\n' "$RELEASE_SHA" "$IMAGE" "$DIGEST" | tee "$GITHUB_STEP_SUMMARY"

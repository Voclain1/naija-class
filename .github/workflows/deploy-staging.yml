# School Kit — staging deploy
#
# Triggers automatically after the `ci` workflow passes on `main`.
# Can also be triggered manually via workflow_dispatch.
#
# Secrets required in this repository (Settings → Secrets → Actions):
#   FLY_API_TOKEN              — Fly.io personal access token (flyctl auth token)
#   STAGING_DATABASE_URL       — Neon app_user connection string (runtime role)
#   STAGING_DIRECT_URL         — Neon school_kit connection string (migration role)
#                                MUST be the school_kit (migration) role, NOT app_user.
#                                Prisma migrate deploy uses directUrl; running DDL
#                                as app_user silently fails because it lacks CREATE
#                                TABLE / ALTER TABLE privileges.
#
# All other runtime secrets (REDIS_URL, BETTER_AUTH_*, R2_*, PAYSTACK_*, etc.)
# are set directly on the Fly apps via `flyctl secrets set` — they live in Fly's
# encrypted secret store and are never needed by this runner.
# See docs/runbooks/provision-production.md for the full `flyctl secrets set` list.

name: deploy-staging

on:
  workflow_run:
    workflows: ["ci"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false  # never cancel an in-flight deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STAGING_API_URL: https://school-kit-api.fly.dev

jobs:
  deploy:
    name: staging deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only run when CI passed (or manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Skip Chromium download on the runner — this step is only for
      # prisma generate + build. Chrome is downloaded *inside* Dockerfile.render
      # during `flyctl deploy` (Docker builder stage), not on the runner.
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: pnpm install --frozen-lockfile

      # Write a minimal .env so dotenv-cli in db package scripts resolves the
      # file without error. Only DATABASE_URL and DIRECT_URL need real values
      # here — the runner doesn't start the API server, it only generates the
      # Prisma client and runs migrations. All other values are placeholders.
      #
      # NOTE: DIRECT_URL must use the school_kit migration role (not app_user).
      # See header comment for why.
      - name: Write deploy .env
        # Map GitHub Secrets (STAGING_*) to the env var names Prisma expects
        # (DATABASE_URL / DIRECT_URL) via the step env block — the only place
        # where ${{ }} expansion is guaranteed regardless of heredoc quoting.
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: |
          cat > .env <<ENVEOF
          NODE_ENV=production
          DATABASE_URL=${DATABASE_URL}
          DIRECT_URL=${DIRECT_URL}
          REDIS_URL=redis://placeholder-not-used-by-runner
          BETTER_AUTH_SECRET=placeholder-not-used-by-runner
          BETTER_AUTH_URL=https://placeholder
          API_PORT=4000
          API_URL=https://placeholder
          CORS_ORIGIN=https://placeholder
          WEB_BASE_URL=https://placeholder
          PORTAL_BASE_URL=https://placeholder
          NEXT_PUBLIC_API_URL=https://placeholder/api/v1
          ANTHROPIC_API_KEY=sk-ant-placeholder
          PAYSTACK_SECRET_KEY=sk_test_placeholder
          PAYSTACK_PUBLIC_KEY=pk_test_placeholder
          TERMII_API_KEY=placeholder
          TERMII_SENDER_ID=SchoolKit
          RESEND_API_KEY=re_placeholder
          R2_ACCOUNT_ID=placeholder
          R2_ACCESS_KEY_ID=placeholder
          R2_SECRET_ACCESS_KEY=placeholder
          R2_BUCKET=school-kit-staging
          SENTRY_DSN_API=
          NEXT_PUBLIC_SENTRY_DSN=
          SENTRY_ENVIRONMENT=staging
          NEXT_PUBLIC_POSTHOG_KEY=
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          # Runner-only placeholder. The DEPLOYED value lives in
          # apps/api/fly.toml's [env] block — this heredoc writes a .env for
          # the CI runner's build (source maps), and nothing here reaches Fly.
          RENDER_WORKER_URL=http://not-used-by-runner:4001
          RENDER_WORKER_PORT=4001
          SENTRY_AUTH_TOKEN=
          ENVEOF

      - name: Prisma generate
        run: pnpm --filter @school-kit/db generate

      - name: Build workspace packages
        run: pnpm -r --filter "./packages/*" build

      # Build the API on the runner so we have dist/*.js.map files for Sentry.
      # This is separate from the Docker build (which rebuilds from source inside
      # the image). The source maps are identical — same tsconfig, same source.
      - name: Build API (for source maps)
        run: pnpm --filter @school-kit/api build

      # Upload source maps to Sentry and create a named release (= git SHA).
      # Requires GitHub Secrets: SENTRY_AUTH_TOKEN (project:releases + org:read
      # scope) and SENTRY_ORG (your Sentry organisation slug).
      # Skipped gracefully if SENTRY_AUTH_TOKEN is not set (first deploy before
      # Sentry is provisioned, or forks). continue-on-error ensures a Sentry
      # outage doesn't block a working deploy.
      - name: Upload Sentry source maps
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: school-kit-api
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping source map upload"
            exit 0
          fi
          npx --yes @sentry/cli@2 releases new "$SENTRY_RELEASE"
          npx @sentry/cli@2 releases files "$SENTRY_RELEASE" upload-sourcemaps apps/api/dist/ --ext .map
          npx @sentry/cli@2 releases finalize "$SENTRY_RELEASE"
          echo "Source maps uploaded for release ${SENTRY_RELEASE}"

      # Runs `prisma migrate deploy` against the Neon staging DB.
      # Prisma reads DIRECT_URL (school_kit role) for DDL; DATABASE_URL
      # (app_user) for the connection pool — both from the .env above.
      - name: Run staging migrations
        run: pnpm --filter @school-kit/db migrate:deploy

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Record the image each Fly app is serving BEFORE this run changes
      # anything. The rollback step below redeploys exactly these refs.
      #
      # Why capture up-front instead of indexing release history after a
      # failure: after a failed run the history has already advanced, and the
      # two apps advance independently (a render-worker deploy can succeed
      # while the API's fails, or vice versa). Indexing "the one before last"
      # per app after the fact is guesswork; a pre-deploy snapshot is exact.
      #
      # Deliberately BEST-EFFORT (|| true): an app with no prior release — a
      # first-ever deploy — has nothing to capture, and that must not block the
      # deploy. The rollback step is the fail-closed half: it refuses to act on
      # an empty ref rather than guessing a target.
      - name: Capture pre-deploy images
        id: preimages
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          capture() {
            app="$1"
            out="$(bash scripts/fly-rollback.sh current-image "$app" 2>/dev/null)" || {
              echo "no prior release captured for $app (first deploy, or lookup failed)"
              return 0
            }
            # helper prints "<version><TAB><imageRef>"; cut -f2 defaults to TAB
            printf '%s' "$(printf '%s' "$out" | cut -f2)"
          }
          api_img="$(capture school-kit-api)"
          worker_img="$(capture school-kit-render-worker)"
          echo "api_image=${api_img}"       >> "$GITHUB_OUTPUT"
          echo "worker_image=${worker_img}" >> "$GITHUB_OUTPUT"
          echo "pre-deploy school-kit-api           = ${api_img:-<none>}"
          echo "pre-deploy school-kit-render-worker = ${worker_img:-<none>}"

      # Build and deploy the API image. Uses apps/api/Dockerfile (no Chrome).
      # The Fly app's runtime secrets (REDIS_URL, BETTER_AUTH_SECRET, etc.)
      # are already set via `flyctl secrets set` — not managed here.
      # SENTRY_RELEASE is embedded as a Docker build arg so the running
      # container knows its release version for Sentry error grouping.
      - name: Deploy API
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy
          --config apps/api/fly.toml
          --build-arg SENTRY_RELEASE=${{ github.sha }}
          --remote-only
          --wait-timeout 180

      # Build and deploy the render worker image. Uses Dockerfile.render
      # (includes Chrome download ~200 MB — build is slower).
      # Keep exactly one worker Machine. Fly Launch originally created two for
      # HA, but this queue is concurrency-1 and scale-to-zero; a wake request
      # can start both identical 2 GB Machines and double render compute with
      # no throughput benefit at the platform's current volume.
      - name: Deploy render worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy
          --config apps/api/fly-render.toml
          --build-arg SENTRY_RELEASE=${{ github.sha }}
          --remote-only
          --wait-timeout 300

      - name: Enforce single render worker machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl scale count 1 --app school-kit-render-worker --yes

      # Give NestJS time to finish initializing on the 512MB Fly machine before
      # hitting /health. More modules = longer startup; 30 s base wait plus
      # the smoke test's own 10×5 s retry loop = 80 s total cold-start budget.
      - name: Wait for API to be ready
        run: sleep 30

      # Five-op smoke test: health → db role → signup → login → schools/me.
      # Any non-zero exit rolls back the API deploy.
      - name: Smoke test
        id: smoke
        run: bash scripts/smoke-test.sh
        env:
          SMOKE_API_URL: ${{ env.STAGING_API_URL }}

      # Auto-rollback on smoke failure: redeploy the exact image each app was
      # serving before this run (captured above).
      #
      # This replaces `flyctl releases rollback`, which DOES NOT EXIST — it is
      # not a subcommand in flyctl v0.4.83, so this step could never have
      # worked. It would have errored out and left the bad image serving while
      # reporting only a generic step failure. Verified 2026-09-26; the
      # replacement mechanism (`flyctl deploy --image`) was exercised against
      # production the same day.
      #
      # BOTH apps are now rolled back, where previously only the API was. The
      # old comment argued the render worker is stateless and untouched by the
      # smoke test — true, but both apps are built from the SAME commit, so
      # rolling back only the API leaves the worker running the rejected code
      # and consuming jobs with it. Each app is handled independently and the
      # helper no-ops for an app whose image did not change, so an app that
      # never advanced is not needlessly redeployed.
      - name: Roll back on smoke failure
        if: steps.smoke.outcome == 'failure'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          API_PRE_IMAGE: ${{ steps.preimages.outputs.api_image }}
          WORKER_PRE_IMAGE: ${{ steps.preimages.outputs.worker_image }}
        run: |
          set -uo pipefail
          echo "Smoke test failed — rolling back to the pre-deploy images"
          rc=0

          roll() {
            app="$1"; cfg="$2"; img="$3"
            if [ -z "$img" ]; then
              echo "::error::no pre-deploy image recorded for $app — refusing to guess a rollback target; roll back by hand (docs/runbooks/deploy-rollback.md)"
              return 1
            fi
            bash scripts/fly-rollback.sh to-image "$app" "$cfg" "$img"
          }

          roll school-kit-api           apps/api/fly.toml        "$API_PRE_IMAGE"    || rc=1
          roll school-kit-render-worker apps/api/fly-render.toml "$WORKER_PRE_IMAGE" || rc=1

          # Post-rollback health gate on the API (the worker is scale-to-zero,
          # so a stopped machine is its correct idle state and not a signal).
          if [ "$rc" -eq 0 ]; then
            if curl -fsS --max-time 30 "${STAGING_API_URL}/api/v1/health" >/dev/null; then
              echo "post-rollback /api/v1/health: OK"
            else
              echo "::error::post-rollback health check FAILED against ${STAGING_API_URL}"
              rc=1
            fi
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::ROLLBACK DID NOT COMPLETE CLEANLY — production may still be on the rejected image. Escalate: docs/runbooks/deploy-rollback.md"
          else
            echo "Rollback complete. See docs/runbooks/deploy-rollback.md for next steps."
          fi

          # Always fail the workflow: the deploy was rejected either way.
          exit 1

      # Tear down the school this run's smoke test created (op 3 signs up a
      # real School + owner User and, until 2026-08-09, never deleted it — the
      # production database had accumulated one per successful deploy since
      # 2026-06-26, ~66 of them, which by then were polluting the platform-admin
      # school roster shipped 2026-08-02).
      #
      # Deliberate choices here:
      #   - `if: always()` — runs even when the smoke test failed and the
      #     rollback step above exited 1. A failed smoke run can still have
      #     completed op 3, so skipping cleanup on failure is exactly the case
      #     that leaks rows.
      #   - `continue-on-error` — cleanup is housekeeping. A psql hiccup must
      #     never turn a healthy deploy into a failed one, and must never
      #     re-trigger the rollback path.
      #   - It prunes EVERY matching smoke school, not just this run's, so the
      #     backlog drains itself and stays drained.
      #   - DIRECT_URL (school_kit migration role), not DATABASE_URL: the
      #     script does `SET LOCAL session_replication_role = 'replica'`, which
      #     app_user cannot do.
      #
      # The predicate is narrow by design — `^smoke-<digits>$` AND an owner
      # email at the RFC-2606-reserved `@smoke-test.invalid` domain. See the
      # header of scripts/prune-smoke-schools.sql for why a plain
      # `LIKE 'smoke-%'` was too dangerous to automate against production.
      - name: Prune smoke-test schools
        if: always()
        continue-on-error: true
        env:
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            echo "psql not available on this runner — skipping smoke-school cleanup."
            echo "Run 'pnpm db:prune-smoke' manually with a DIRECT_URL if this persists."
            exit 0
          fi
          if [ -z "${DIRECT_URL}" ]; then
            echo "STAGING_DIRECT_URL not set — skipping smoke-school cleanup."
            exit 0
          fi
          echo "--- Preview: what is about to be pruned ---"
          psql "${DIRECT_URL}" -f scripts/list-smoke-schools.sql || true
          echo "--- Pruning ---"
          psql "${DIRECT_URL}" -v ON_ERROR_STOP=1 -f scripts/prune-smoke-schools.sql

      # cp4 placeholder: Sentry source map upload goes here.
      # Requires SENTRY_AUTH_TOKEN secret + sentry-cli install.
      # Tracked in slice 1b cp4.

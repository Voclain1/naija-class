name: messaging-coordinated-cutover
on:
  push:
    branches: [ops/messaging-coordinated-cutover]
permissions:
  contents: read
jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      OLD_SHA: 25e54017aa0d41870ab3988f1c55be3d00cab54e
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The old production release's own schema (migrations as of 25e54017)
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          git archive "$OLD_SHA" packages/db/prisma/migrations | tar -x -C "$RUNNER_TEMP/baseline"
          while IFS= read -r -d '' path; do
            cmp "$path" "${path#"$RUNNER_TEMP/baseline/"}"
          done < <(find "$RUNNER_TEMP/baseline/packages/db/prisma/migrations" -name migration.sql -print0)
      - name: Verify application image build inputs are unchanged
        run: |
          base=aaeaa25147d77f8e7177b302e2bd30340a5e0372
          git diff --name-only "$base" HEAD | while read -r path; do
            case "$path" in
              infra/vps/ops-tools/cutover.sh|infra/vps/releases/messaging-approved/*|scripts/batch3-cutover-rehearsal.sh|docs/runbooks/messaging-instalment-cutover.md|.github/workflows/batch2-images.yml|.github/workflows/messaging-coordinated-cutover.yml) ;;
              *) echo "Unexpected build input change: $path"; exit 1 ;;
            esac
          done
      - name: Rehearse the guarded cutover, including its failure paths
        env:
          FRONTEND_OVERRIDE: infra/vps/releases/messaging-approved/frontend.compose.yml
          FRONTEND_SHA: 2ee1442788e6e5d173f38a554a80232250418398
          RELEASE_MANIFEST: infra/vps/releases/messaging-approved/manifest.env
          OLD_API: ghcr.io/voclain1/school-kit-api@sha256:58d4630e6a64aea0e852ebf336d12de2c90592347b986e77ceecb1e52adae2aa
          OLD_RENDER: ghcr.io/voclain1/school-kit-render:61b5c214cdc4c3908564321459b039c4f2dffcbb
          BASELINE_MIGRATIONS: ${{ runner.temp }}/baseline/packages/db/prisma/migrations
        run: bash scripts/batch3-cutover-rehearsal.sh

      - name: Assemble the checksummed cutover package
        env:
          FRONTEND_SHA: 2ee1442788e6e5d173f38a554a80232250418398
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/coordinated-release"
          mkdir -p "$out/release" "$out/ops-tools"
          cp infra/vps/releases/messaging-approved/* "$out/release/"
          cp infra/vps/ops-tools/*.{sh,py} "$out/ops-tools/"
          printf '%s\n' "$GITHUB_SHA" > "$out/ops-tools/HEAD_SHA"
          (
            cd "$out/ops-tools"
            sha256sum *.sh *.py HEAD_SHA > SHA256SUMS
          )
          cd "$out"
          printf 'FRONTEND_SHA=%s\nBACKEND_SHA256=%s\nFRONTEND_SHA256=%s\n' "$FRONTEND_SHA" \
            "$(sha256sum release/manifest.env | cut -d' ' -f1)" \
            "$(sha256sum release/frontend.compose.yml | cut -d' ' -f1)" > release/pair.env
          sha256sum release/* ops-tools/SHA256SUMS > RELEASE_SHA256SUMS
          cat RELEASE_SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: messaging-coordinated-cutover
          path: ${{ runner.temp }}/coordinated-release/
          if-no-files-found: error

  vps-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Check disk and live application pins
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          free_kib=$(df -Pk /var/lib/docker | awk 'NR == 2 {print $4}')
          [[ $free_kib =~ ^[0-9]+$ ]] && [ "$free_kib" -ge 5242880 ]
          echo "PASS Docker filesystem: $free_kib KiB available"
          expected() {
            local cid
            cid=$(docker ps -q --filter label=com.docker.compose.project=school-kit --filter "label=com.docker.compose.service=$1")
            [ -n "$cid" ]
            [ "$(docker inspect -f '{{.Config.Image}}' "$cid")" = "$2" ]
            echo "PASS $1 running approved baseline image"
          }
          expected api ghcr.io/voclain1/school-kit-api@sha256:58d4630e6a64aea0e852ebf336d12de2c90592347b986e77ceecb1e52adae2aa
          expected web ghcr.io/voclain1/school-kit-web@sha256:554321b10925ef51f5af458cfa67dd4c4bd464f3bfa101257f118c4482186f4c
          expected portal ghcr.io/voclain1/school-kit-portal@sha256:aa390fb129faf424090467ec0f5a0f0cd51000b485df64f9e0ad659aeea90985
          expected render-worker ghcr.io/voclain1/school-kit-render:61b5c214cdc4c3908564321459b039c4f2dffcbb
          expected ops-pinned ghcr.io/voclain1/school-kit-postgres@sha256:1c0ac5407c14975abad8240218366477a6c2515c6d7fbc6a379a121577d4429d
          REMOTE

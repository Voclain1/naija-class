# Compares GitHub's BACKUP_ENV_FILE with the running /opt/school-kit/backup.env and BLOCKS
# (fails the check) on anything unresolved: empty or missing required values, duplicates,
# provider-rule violations, or any difference between the two. Modelled on Batch 1's
# reconcile-production-config. Prints key NAMES and verdicts only (no values, lengths or
# hashes; see infra/vps/backup_env.py). Writes nothing to backup.env; protected 0600 copies
# of both files are kept under /opt/school-kit/config-backups so a change can be reverted.
# It does not write the GitHub secret: secrets are write-only (owner procedure in
# docs/runbooks/batch2-acceptance-and-batch3.md §3).
name: backup-config-reconcile
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  validator-tests:
    if: github.event.pull_request.number == 563 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validator tests on fictional files (verdicts and no value leakage)
        run: bash scripts/backup-env-test.sh
  compare:
    needs: validator-tests
    if: github.event.pull_request.number == 563 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unified-messaging-infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Compare (blocks on any unresolved discrepancy)
        env:
          BACKUP_ENV_FILE: ${{ secrets.BACKUP_ENV_FILE }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$BACKUP_ENV_FILE" ] || { echo "BLOCK stored BACKUP_ENV_FILE is empty"; exit 1; }
          ssh vps 'umask 077; mkdir -p -m 700 /opt/school-kit/config-backups'
          ssh vps 'umask 077; cat > /opt/school-kit/config-backups/.backup_env.py' < infra/vps/backup_env.py
          printf '%s\n' "$BACKUP_ENV_FILE" | ssh vps 'umask 077; cat > /opt/school-kit/config-backups/.backup-env.incoming'
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /opt/school-kit
          [ -s backup.env ] || { echo "BLOCK running backup.env unavailable"; exit 1; }
          d="config-backups/batch2-backup-env-$(date -u +%Y%m%dT%H%M%SZ)"; mkdir -m 700 "$d"
          cp -p backup.env "$d/backup.env.running"
          mv config-backups/.backup-env.incoming "$d/backup.env.github"
          mv config-backups/.backup_env.py "$d/backup_env.py"
          chmod 600 "$d"/*
          echo "protected copies: /opt/school-kit/$d"
          python3 "$d/backup_env.py" compare "$d/backup.env.running" "$d/backup.env.github"
          REMOTE

# School Kit: CI
#
# Routine CI for every pull request and every push to main, restructured (2026-11-27,
# docs/reviews/ci-performance-2026-11-27.md) from one 13-minute serial job plus one 12-minute e2e
# job into parallel jobs, each short:
#
#   changes ──┬─ static (lint, typecheck, web/portal/cbt unit tests)  ┐
#             ├─ api-test  x6 shards (own PostgreSQL 18)              ├─ ci   "lint + typecheck + test + build"
#             ├─ build (web, portal, cbt, once) ──┬───────────────────────┘
#             │                                   └─ e2e-test x5 shards ── e2e  "e2e (Playwright)"
#             ├─ tooling (release tooling unit tests, shellcheck, scripts)
#             └─ backup-image
#
# The two aggregate jobs keep their old names ("lint + typecheck + test + build" and
# "e2e (Playwright)"): branch protection and release.yml's "CI is green" gate read those names.
#
# What is NOT weakened: every test that ran before still runs, with the same assertions, against the
# same PostgreSQL major as production (18, and each database job proves it). On a pull request a job is
# skipped only when scripts/ci/changes.py recognises every changed file as unable to affect it; an
# unrecognised file runs everything. Pushes to main, the nightly schedule and manual runs ALWAYS run
# everything, and the aggregates fail if any job was skipped on such a run.
#
# Extended checks live elsewhere on purpose: the real-stack release qualification is
# release-qualification.yml; nightly here adds unit-test coverage (api, web), which is reporting only.

name: ci

on:
  pull_request:
    branches: [main, feat/unified-messaging-infrastructure]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # nightly: everything, plus coverage
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a newer push supersedes this run

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------------------------------------------------------------------
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      static: ${{ steps.c.outputs.static }}
      api: ${{ steps.c.outputs.api }}
      frontend_apps: ${{ steps.c.outputs.frontend_apps }}
      build: ${{ steps.c.outputs.build }}
      e2e: ${{ steps.c.outputs.e2e }}
      tooling: ${{ steps.c.outputs.tooling }}
      backup_image: ${{ steps.c.outputs.backup_image }}
      all: ${{ steps.c.outputs.all }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # the pull request's merge commit and its base parent
      - name: Decide what this change needs
        id: c
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/ci/changes.py --base HEAD^1 --head HEAD | tee -a "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/changes.py --all | tee -a "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------------------------
  static:
    name: lint + typecheck + frontend tests
    needs: changes
    if: needs.changes.outputs.static == 'true' || needs.changes.outputs.frontend_apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Restore Turbo's cache (content-addressed, so a partial hit is always safe)
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/turbo
          key: turbo-static-${{ github.sha }}
          restore-keys: turbo-static-
      # one turbo invocation runs lint and typecheck of every workspace concurrently
      - name: Lint and typecheck every workspace
        if: needs.changes.outputs.static == 'true'
        run: pnpm turbo run lint typecheck --cache-dir=node_modules/.cache/turbo
      # web, portal and cbt unit tests take 13 s, 2 s and 2 s together: not worth a runner each
      - name: Frontend unit tests
        if: needs.changes.outputs.frontend_apps != '[]'
        env:
          APPS: ${{ needs.changes.outputs.frontend_apps }}
        run: |
          set -euo pipefail
          bash scripts/ci/write-env.sh
          for app in $(python3 -c 'import json,os; print(" ".join(json.loads(os.environ["APPS"])))'); do
            echo "== $app"; pnpm --filter "@school-kit/$app" test
          done

  # ---------------------------------------------------------------------------------------------
  api-test:
    name: api tests (${{ matrix.shard == 'slow' && 'the 94-second timing spec' || format('shard {0}/6', matrix.shard) }})
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # `slow` is ONE spec file (src/common/queue/worker-tuning.spec.ts, ~94 s of timing assertions) that
        # would otherwise make whichever shard holds it twice as long as the rest. It runs in its own job
        # in parallel, and every shard excludes it: nothing is dropped, the union is every spec file.
        shard: [1, 2, 3, 4, 5, 6, "slow"]
    # Each shard owns its database: apps/api's tests run serially against one shared PostgreSQL (a
    # deliberate property: RLS bugs only show on a real server), and that stays true inside a shard.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env: { POSTGRES_USER: school_kit, POSTGRES_PASSWORD: school_kit, POSTGRES_DB: school_kit }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school_kit -d school_kit" --health-interval 3s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      # The render integration spec needs real Chromium. Puppeteer's postinstall only downloads on a
      # pnpm-store MISS, so the browser has its own cache and an explicit, idempotent install.
      - name: Cache Puppeteer browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chrome for Puppeteer
        run: pnpm --filter @school-kit/api exec puppeteer browsers install chrome
      - name: CI environment
        run: bash scripts/ci/write-env.sh
      - name: Prepare PostgreSQL (and prove it is the production major)
        run: bash scripts/ci/db-init.sh 18
      - name: Migrate and seed
        run: |
          pnpm --filter @school-kit/db migrate:deploy
          pnpm --filter @school-kit/db seed
      - name: API tests
        working-directory: apps/api
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          slow=src/common/queue/worker-tuning.spec.ts
          test -f "$slow"   # if the file moves, this fails loudly instead of the shards silently including or dropping it
          if [ "$SHARD" = slow ]; then
            pnpm exec vitest run "$slow"
          else
            pnpm exec vitest run --shard="$SHARD/6" --exclude "**/worker-tuning.spec.ts"
          fi
      # CLAUDE.md calls `pnpm ai:eval` required before a prompt PR merges; it needs no key and takes
      # about two seconds, so it runs once, in shard 1.
      - name: AI evals
        if: matrix.shard == 1
        run: pnpm ai:eval

  # ---------------------------------------------------------------------------------------------
  # The three Next.js production builds, made ONCE. They are the "does it compile" check CI always
  # had (the old ci job built web and portal, the e2e job built web, portal and cbt again) and the
  # exact servers every Playwright shard runs against.
  build:
    name: build web, portal, cbt
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: CI environment
        run: bash scripts/ci/write-env.sh
      - name: Cache Next.js incremental build output
        uses: actions/cache@v6
        with:
          path: |
            apps/web/.next/cache
            apps/portal/.next/cache
            apps/cbt/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      # NEXT_PUBLIC_* are baked in at build time, so the local addresses the e2e servers use are given
      # here; unset, a production build would link to the live portal and exam app. NODE_ENV is unset
      # because .env says "test" and `next build` only prerenders under its own "production".
      - name: Build web, portal and cbt
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3002
          NEXT_PUBLIC_CBT_URL: http://localhost:3003
          NEXT_PUBLIC_SCHOOL_ADDRESS_DOMAIN: localhost:3002
        run: |
          set -a; . ./.env; set +a
          unset NODE_ENV
          pnpm --filter @school-kit/web build &
          pnpm --filter @school-kit/portal build &
          pnpm --filter @school-kit/cbt build &
          fail=0; for pid in $(jobs -p); do wait "$pid" || fail=1; done; exit $fail
      - name: Package the builds for the e2e shards
        run: tar -C . -cf "$RUNNER_TEMP/next-builds.tar" --exclude='.next/cache' apps/web/.next apps/portal/.next apps/cbt/.next
      - uses: actions/upload-artifact@v7
        with:
          name: next-builds
          path: ${{ runner.temp }}/next-builds.tar
          compression-level: 1
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  e2e-test:
    name: e2e shard ${{ matrix.shard }}/5
    needs: [changes, build]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env: { POSTGRES_USER: school_kit, POSTGRES_PASSWORD: school_kit, POSTGRES_DB: school_kit }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school_kit -d school_kit" --health-interval 3s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: CI environment
        run: bash scripts/ci/write-env.sh
      - name: Prepare PostgreSQL (and prove it is the production major)
        run: bash scripts/ci/db-init.sh 18
      - name: Migrate and seed
        run: |
          pnpm --filter @school-kit/db migrate:deploy
          pnpm --filter @school-kit/db seed
      # chromium (~110 MB) keyed on the e2e workspace's pinned @playwright/test version
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright chromium
        run: pnpm --filter @school-kit/e2e exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: next-builds
          path: ${{ runner.temp }}
      - name: Unpack the production builds
        run: tar -C . -xf "$RUNNER_TEMP/next-builds.tar"
      # playwright.config.ts's webServer starts the API (dev) and `next start` for web, portal and cbt
      - name: Playwright, shard ${{ matrix.shard }} of 5
        env:
          CI: "true"
          E2E_NEXT_START: "1"
        run: pnpm --filter @school-kit/e2e exec playwright test --shard=${{ matrix.shard }}/5
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Upload fictional instalment previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instalment-previews-${{ matrix.shard }}
          path: e2e/test-results/**/*-preview.png
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  tooling:
    name: release tooling and scripts
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Python unit tests (release tooling, CI change detection)
        run: |
          set -euo pipefail
          for t in infra/vps/release/test_*.py scripts/ci/test_*.py; do
            [ -f "$t" ] || continue
            echo "== $t"; python3 -W error::ResourceWarning -m unittest -v "$t"
          done
      - name: Shell script tests
        run: |
          set -euo pipefail
          for t in scripts/ops-tools-test.sh scripts/backup-env-test.sh scripts/release/*.test.sh scripts/__tests__/*.test.sh; do
            [ -f "$t" ] || continue
            echo "== $t"; bash "$t"
          done
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(ls infra/vps/release/*.sh scripts/release/*.sh scripts/release-qualification/*.sh scripts/ci/*.sh 2>/dev/null || true)
          [ "${#files[@]}" -eq 0 ] || shellcheck -S warning "${files[@]}"
      - name: Workflow and action files parse
        run: |
          python3 - <<'PY'
          import glob, sys
          import yaml
          bad = 0
          for f in glob.glob(".github/workflows/*.yml") + glob.glob(".github/actions/*/action.yml"):
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  print("BAD", f, e); bad = 1
          sys.exit(bad)
          PY

  backup-image:
    name: PostgreSQL backup image
    needs: changes
    if: needs.changes.outputs.backup_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the PostgreSQL 18 backup image (layer-cached)
        uses: docker/build-push-action@v7
        with:
          context: infra/vps/postgres
          build-args: PG_MAJOR=18
          load: true
          tags: school-kit-backup-check
          cache-from: type=gha,scope=backup-image
          cache-to: type=gha,scope=backup-image,mode=max
      - name: Verify pinned tools and generated R2 configuration
        run: |
          docker run --rm --network none --entrypoint sh school-kit-backup-check -ec '
            rclone version | grep -Fx "rclone v1.76.0"
            wal-g --version
            test -x /ops/backup.sh
            test -x /ops/restore-test.sh
            docker_config_check() {
              grep -Eq "^export RCLONE_CONFIG_BACKUP_$1=.*$2" /ops/env.sh
            }
            BACKUP_BUCKET=fixture /ops/entrypoint.sh &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            n=0
            until test -s /ops/env.sh && test -f /etc/cron.d/school-kit; do
              n=$((n + 1))
              test "$n" -lt 25
              sleep 0.2
            done
            docker_config_check PROVIDER Cloudflare
            docker_config_check REGION auto
            docker_config_check NO_CHECK_BUCKET true
            docker_config_check NO_HEAD true
          '

  # ---------------------------------------------------------------------------------------------
  # Nightly, reporting only (no threshold): unit-test coverage. Not in the routine path because
  # collecting it slows the suite and it cannot be merged across shards without more machinery.
  coverage:
    name: coverage (nightly)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env: { POSTGRES_USER: school_kit, POSTGRES_PASSWORD: school_kit, POSTGRES_DB: school_kit }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school_kit -d school_kit" --health-interval 3s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Cache Puppeteer browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @school-kit/api exec puppeteer browsers install chrome
      - run: bash scripts/ci/write-env.sh
      - run: bash scripts/ci/db-init.sh 18
      - run: |
          pnpm --filter @school-kit/db migrate:deploy
          pnpm --filter @school-kit/db seed
      - name: Unit tests with coverage (api, web)
        env:
          VITEST_COVERAGE: "1"
        run: pnpm --filter @school-kit/api --filter @school-kit/web test
      - name: Coverage summary
        run: |
          node -e '
            const fs = require("node:fs");
            const rows = ["| App | Lines | Branches | Functions |", "|---|---|---|---|"];
            for (const app of ["api", "web"]) {
              const file = `apps/${app}/coverage/coverage-summary.json`;
              if (!fs.existsSync(file)) { rows.push(`| ${app} | not produced | | |`); continue; }
              const t = JSON.parse(fs.readFileSync(file, "utf8")).total;
              rows.push(`| ${app} | ${t.lines.pct}% | ${t.branches.pct}% | ${t.functions.pct}% |`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Unit test coverage (nightly)\n\n" + rows.join("\n") + "\n");
          '

  # ---------------------------------------------------------------------------------------------
  # The two aggregates. Their NAMES are the contract with branch protection and release.yml.
  # A job that was skipped is fine on a pull request that cannot affect it; a job that FAILED or was
  # CANCELLED never is; and when the run is a push to main, a schedule or a manual run (changes.all)
  # nothing may be skipped at all, which catches a mis-wired condition rather than hiding it.
  ci:
    name: lint + typecheck + test + build
    needs: [changes, static, api-test, build, tooling, backup-image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed (or was legitimately skipped)
        env:
          NEEDS: ${{ toJson(needs) }}
          ALL: ${{ needs.changes.outputs.all }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          full = os.environ["EVENT"] != "pull_request" or os.environ["ALL"] == "true"
          bad = []
          for name, n in needs.items():
              r = n["result"]
              print(f"{name:16} {r}")
              if r in ("failure", "cancelled"):
                  bad.append(f"{name} {r}")
              if full and r == "skipped" and name not in ("changes",):
                  bad.append(f"{name} was skipped on a run that must run everything")
          if needs["changes"]["result"] != "success":
              bad.append("changes did not succeed")
          if bad:
              print("FAILED:", "; ".join(bad)); sys.exit(1)
          PY

  e2e:
    name: e2e (Playwright)
    needs: [changes, build, e2e-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every e2e shard passed (or e2e legitimately did not apply)
        env:
          NEEDS: ${{ toJson(needs) }}
          ALL: ${{ needs.changes.outputs.all }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          full = os.environ["EVENT"] != "pull_request" or os.environ["ALL"] == "true"
          bad = []
          for name, n in needs.items():
              r = n["result"]
              print(f"{name:10} {r}")
              if r in ("failure", "cancelled"):
                  bad.append(f"{name} {r}")
              if full and r == "skipped" and name != "changes":
                  bad.append(f"{name} was skipped on a run that must run everything")
          if needs["changes"]["result"] != "success":
              bad.append("changes did not succeed")
          if bad:
              print("FAILED:", "; ".join(bad)); sys.exit(1)
          PY

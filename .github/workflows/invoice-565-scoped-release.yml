name: invoice-565-scoped-release
on:
  push:
    branches: [ops/invoice-565-scoped-release]
permissions:
  contents: read
concurrency:
  group: invoice-565-scoped-release
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Activate previously staged digests without reapplying migration
        run: |
          set -euo pipefail
          ssh vps bash -s -- \
            ghcr.io/voclain1/school-kit-api@sha256:3653567ba87cb57150b963b2bf0f86cba1c7810a7f270b3968665b8c0ce1b679 \
            ghcr.io/voclain1/school-kit-web@sha256:dd5de4d4bb0359269295030dceaa344cb7e0a7b992062f19495b1575fc144d15 \
            1d88fb0a9daa362e53bb7b2c62775e49424390f6f49b5fb258fd3c1f157dc199 \
            < .github/workflows/invoice-565-activate.sh
